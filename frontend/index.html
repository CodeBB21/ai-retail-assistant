<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Prédiction Client</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h2>Prédire le statut d'un client</h2>

    <form id="predictForm">
        <input type="number" step="0.1" id="age" placeholder="Âge" required>
        <input type="number" step="0.1" id="income" placeholder="Revenu" required>
        <input type="number" step="0.1" id="amount" placeholder="Montant d'achat" required>
        <input type="number" step="0.1" id="frequency" placeholder="Fréquence d'achat" required>
        <input type="number" step="0.1" id="last" placeholder="Jours depuis dernier achat" required>

        <select id="gender" required>
            <option value="">Genre</option>
            <option value="Male">Homme</option>
            <option value="Female">Femme</option>
        </select>

        <select id="city" required>
            <option value="">Ville</option>
            <option value="Paris">Paris</option>
            <option value="Lyon">Lyon</option>
            <option value="Marseille">Marseille</option>
            <option value="Nice">Nice</option>
            <option value="Toulouse">Toulouse</option>
        </select>

        <select id="category" required>
            <option value="">Catégorie</option>
            <option value="Electronics">Electronics</option>
            <option value="Fashion">Fashion</option>
            <option value="Beauty">Beauty</option>
            <option value="Sports">Sports</option>
            <option value="Home">Home</option>
        </select>

        <button type="submit">Prédire</button>
    </form>

    <h3 id="result"></h3>
</div>

<script src="script.js"></script>

</body>
</html>
